# What `cargo audit` is allowed to pass over, and why. Read by tools/audit.sh,
# which release builds run. Every entry here is a decision, dated, with the
# condition that ends it — an ignore with no end is a vulnerability nobody is
# looking at.

[advisories]
# Nothing is ignored. The one entry there was — RUSTSEC-2023-0071, the Marvin
# timing side channel in the `rsa` crate, accepted on 2026-09-12 (security
# audit M6) until rsa 0.10 shipped — ended on 2026-09-15 the other way: the
# crate left the graph when signing moved to SM2 over SM3, and nothing signs
# or verifies with RSA any more.
ignore = []
# Unmaintained crates are reported as warnings and not hidden: rustybuzz and
# ttf-parser (RUSTSEC-2026-0206, -0192) parse document fonts for outlined
# text, and their successors are a migration to plan, not an ignore to add.
# (Security audit L6.)
informational_warnings = ["unmaintained"]
