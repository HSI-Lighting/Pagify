[package]
name    = "pagify_shell"
edition.workspace = true
version.workspace = true
description = "Pagify Desktop's UI-free core: document session, page space, markup layer, command dispatch."

# No UI dependency, ever. If logic can be tested without a window it lives here,
# and this manifest is the enforcement point — build plan §9, "app.rs gravity".
[dependencies]
pdf_core.workspace   = true
cad_kernel.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
