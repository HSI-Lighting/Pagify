[package]
name    = "pagify_app"
edition.workspace = true
version.workspace = true
description = "Pagify Desktop: the eframe binary."

[dependencies]
# Wipes the held lock passcode when it is dropped rather than leaving it in
# freed memory — see `PagifyApp::held_passcode`.
zeroize = "1"

pagify_shell = { path = "../pagify_shell" }
pdf_core.workspace   = true
cad_kernel.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui   = "0.36"
egui_extras = { version = "0.36", default-features = false }
# Native file dialogs. Without one there is literally no way to open a document
# from the interface — which is exactly what happened.
rfd    = "0.15"
# Decodes the embedded logo. PNG only — every other decoder is dead weight in
# the binary and attack surface with nothing asking for it.
image  = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The Linux windowing backends are additive and only meaningful there; on macOS
# and Windows eframe uses the platform's own and these features do not apply.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# The native Print dialog and the GDI calls Ctrl+P sends a page's own
# rendered bitmap through — see `print_windows`. Windows-only: no printing
# feature exists yet for the other two platforms this builds for.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    # `StartDocW`/`StartPage`/`EndPage`/`EndDoc`/`AbortDoc`/`DOCINFOW` — the
    # actual GDI print-job functions `wingdi.h` documents — live under this
    # crate's own `Storage::Xps` path, not `Graphics::Gdi`, despite what
    # their own HDC parameter and Microsoft's own header categorisation
    # would suggest. Confirmed against the crate's own generated source,
    # not assumed from the docs.
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_System_Com",
] }
# To read the `HWND` out of `eframe::Frame::window_handle()`'s own
# `raw_window_handle::RawWindowHandle` — matching the exact version `eframe`
# itself depends on, confirmed against this workspace's own `Cargo.lock`.
raw-window-handle = "0.6"

[dev-dependencies]
egui_kittest = "0.36"
# Reads the session log's own JSON lines back out in its wiring test —
# already resolved via pagify_shell/pdf_core, so this adds an edge, not a
# new crate.
serde_json = "1"

# Finder hands a double-clicked document to an application through an Apple
# Event, never through `argv`. Without a handler for it macOS answers for the
# app — "Pagify cannot open files in the PDF document format" — which is what a
# person sees when they double-click a PDF. These are already in the tree via
# winit; naming them here makes the dependency deliberate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

# Embeds pagify-logo.ico as the .exe's own icon resource (build.rs) — without
# this, Explorer/Start Menu/taskbar/shortcuts all show the generic exe icon,
# since egui::IconData only sets the *window* icon at runtime, not the PE
# resource a shortcut reads before the process ever starts.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
