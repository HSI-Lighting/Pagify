[package]
name = "pdf_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Pagify PDF engine: parsing, rendering and caching behind a stable JNI surface."

[lib]
# `cdylib` is what the JVM dlopen()s; `rlib` keeps `cargo test` able to build the
# crate as a normal library so the pure-logic modules can be unit-tested on the host.
# `staticlib` is what the Xcode target links: one archive, no second binary to
# sign and no dlopen path to get wrong. `cdylib` stays for the JVM, `rlib` for
# `cargo test`.
crate-type = ["cdylib", "staticlib", "rlib"]

[patch.crates-io]
# One line changed: PdfDocument::handle() made public, which is what makes
# incremental save, page deletion and reordering reachable at all. The reasons,
# the measurements behind them and how to update are in rust/vendor/README.md.
pdfium-render = { path = "../vendor/pdfium-render" }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Rendering backend. Default features pull in `pdfium_latest` (== pdfium_7881),
# which is why the bundled libpdfium.so is pinned to chromium/7881 — see
# tools/fetch_pdfium.ps1. Its own `image` bridge stays off: we render straight
# into caller-supplied buffers, so nothing here needs its bitmap conversions.
pdfium-render = { version = "0.9.3", default-features = false, features = [
    "pdfium_latest",
    "thread_safe",
] }

# Encoding for the capture export, and nothing else. Only the two formats the
# export offers are switched on — every other decoder the crate can build is dead
# weight in the .so and, being a decoder of untrusted input, attack surface with
# nothing asking for it.
#
# Encoded here rather than in Kotlin so the whole capture path stays in the
# platform-neutral core: iOS and desktop inherit it, and the export is testable on
# the host down to the bytes.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Markup on a capture: anti-aliased path fill and stroke, composited into the
# same buffer PDFium rendered into.
#
# A pure-Rust port of Skia's raster backend, so it adds **no C++ dependency** —
# which is the whole reason it is this and not `skia-safe` or `cairo`. A C++
# graphics dependency here would tie the one feature most likely to be reused to
# the Android build. `vello`/`femtovg` are GPU renderers and would need surface
# management for a still image; `imageproc` has no proper anti-aliased stroking.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-bidi = "0.3"

# Recognition. Behind a feature so a phone build can decline it, and **on by
# default** so the desktop build — the one anybody runs `cargo test` in — always
# type-checks the engine. A default-off feature around real code is how that
# code stops compiling without anyone noticing; the crate already refuses to put
# `editing` behind a flag for the same reason. Mobile turns it off explicitly
# with `--no-default-features` when it wants the smaller binary.
#
# `rten` is pure Rust, which is what makes this defensible at all: no ONNX
# Runtime, no C++ toolchain, no per-platform prebuilt to ship and sign. The M0
# spike measured it at ~950 ms and 482 MB peak for a 300 dpi page, which is why
# `tiling` exists and is not optional on a phone.
ocrs = { version = "0.10.4", optional = true }
rten = { version = "0.21", optional = true }
rten-tensor = { version = "0.21", optional = true }
rten-imageproc = { version = "0.21", optional = true }



# NFKC for the *search* index only. Pure Rust and small, which is the same test
# every other dependency here passed: a C++ graphics or ICU dependency would tie
# extraction to a platform, and this does not.
unicode-normalization = "0.1"
subsetter = "0.2.2"
# Content streams are FlateDecode'd, and `pdf::content` has to read one to take
# locked text out of it — see `crate::pdf`. Also how the redaction acceptance
# test answers "are the words still in the file?" without asking PDFium, which
# is the library that wrote it. Pure Rust (miniz_oxide), so it adds no C
# dependency to any build.
flate2 = "1"
# Encryption — Protect phase 4. Platform-neutral and host-testable; none of it
# touches a PDF.
#
# `sm4` is the block cipher; GCM is **composed over it** with `aes-gcm`'s generic
# AEAD machinery rather than hand-written, because a hand-rolled GCM produces
# ciphertext that looks perfectly convincing and is not secure. `argon2` derives
# the key-encryption key; `zeroize` wipes it. `rand_core` supplies the salt and
# the data key.
sm4 = "0.5"
aes-gcm = "0.10"
# PDF's own encryption (ISO 32000-2 §7.6.4.3.4) is AES-256 in CBC with a
# SHA-2 key derivation — neither the GCM above nor Argon2 below can stand in
# for it, because the bytes have to be exactly what other readers expect.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
# A PDF signature is a CMS SignedData blob over a byte range of the file
# itself — see `crate::sign`. None of this is optional: a signature that is
# not one is worse than none at all.
rsa = { version = "0.9", features = ["sha2"] }
cms = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["oid"] }
x509-cert = "0.2"
const-oid = { version = "0.9", features = ["db"] }
spki = "0.7"
p12 = "0.6"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# No `lopdf`. PDFium is the single writer: two independent object models writing
# one file is a corruption class that is very hard to diagnose, and PDFium covers
# the page tree, objects, text and save on its own. If lopdf ever comes back it is
# for read-only structural analysis, and not before it has been fuzzed.

[dev-dependencies]
# Tests only — never in the shipped library.

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.15"

# Logging on iOS goes to the unified log, where Console.app and Xcode already
# look, rather than to a stderr nothing reads on a device.
[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

# No `editing` feature. Editing is the product, not an option, and a flag around it
# means the default build never type-checks the editing path — which is how the
# previous one came to gate a module that had never been written.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
# Deliberately NOT `panic = "abort"`. Every JNI entry point wraps its body in
# `catch_unwind` and converts a panic into a Java exception; aborting instead would
# turn any malformed-PDF edge case into a process kill with no diagnostics.
panic = "unwind"

# iOS links the `staticlib`, and `strip = "symbols"` above erases the very
# `#[no_mangle]` exports the Xcode target has to resolve — a stripped archive
# links with "undefined symbol _pagify_open_document" and nothing else to go on.
# Stripping is right for the Android `.so`, so it stays; this profile is the same
# release build with the symbol table kept.
[profile.release-ios]
inherits = "release"
strip = "none"
# LTO must be off, and this is the trap that costs the afternoon.
#
# `lto = true` above is right for the Android `.so`, which is *linked*. iOS links
# the `staticlib`, and when the output is an archive rather than a linked binary,
# LTO drops the `#[no_mangle]` exports on the way through — nothing references
# them from inside the crate, and there is no link step yet to tell it something
# outside will. Measured on this crate: `lto = true` and `lto = "thin"` each
# produce an archive defining **0** `_pagify_*` symbols; `lto = false` defines all
# **37**. It is not a link error you can read, either — the archive builds
# happily and Xcode fails later with "undefined symbol _pagify_open_document".
#
# Check with `nm -g --defined-only libpdf_core.a | grep pagify` after any change
# to this profile, rather than trusting that it still works.
lto = false

[features]
default = ["ocr-engine"]
ocr-engine = ["dep:ocrs", "dep:rten", "dep:rten-tensor", "dep:rten-imageproc"]
