org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Which cargo profile the Rust core is built with. `debug` cuts the native build
# from ~20s to ~5s but renders several times slower, so it is opt-in:
#   ./gradlew assembleDebug -Ppagify.rustProfile=debug
pagify.rustProfile=release

# ABIs to build. Trim this to just your test device's ABI for faster iteration:
#   ./gradlew assembleDebug -Ppagify.abis=arm64-v8a
pagify.abis=arm64-v8a,armeabi-v7a,x86_64
